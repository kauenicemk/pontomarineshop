name = "pontomarineshop"
main = "public/_worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ponto-gaveta-pro-db"
database_id = "e68095cf-365f-4896-a4d6-46230e86b4d7"

# Variáveis não-sensíveis. São lidas em src/config.js via aplicarVarsDoAmbiente(env),
# chamado a cada requisição em public/_worker.js — no Workers elas NÃO chegam por process.env.
[vars]
BIOMETRIA_LIMIAR = "0.5"
JORNADA_MENSAL_HORAS = "220"

# Segredos — NÃO colocar aqui (este arquivo é versionado). Configure com:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put ADMIN_EMAIL_INICIAL
#   npx wrangler secret put ADMIN_SENHA_INICIAL
#   npx wrangler secret put TOTEM_SENHA_INICIAL
# Para testar localmente, copie .dev.vars.example para .dev.vars
# (já está no .gitignore) e preencha os mesmos quatro valores lá.
